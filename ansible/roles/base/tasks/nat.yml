---
- name: Enable IP forwarding
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    regexp: '^#?net.ipv4.ip_forward'
    line: 'net.ipv4.ip_forward=1'
  notify: Apply sysctl

- name: Install iptables-persistent
  ansible.builtin.apt:
    name: iptables-persistent
    state: present

- name: Add MASQUERADE rule
  ansible.builtin.shell: |
    iptables -t nat -C POSTROUTING -o {{ ansible_default_ipv4.interface }} -j MASQUERADE 2>/dev/null \
    || iptables -t nat -A POSTROUTING -o {{ ansible_default_ipv4.interface }} -j MASQUERADE
  changed_when: false

- name: Allow FORWARD outbound from private subnet
  ansible.builtin.shell: |
    iptables -C FORWARD -s 192.168.3.16/28 -j ACCEPT 2>/dev/null \
    || iptables -I FORWARD 1 -s 192.168.3.16/28 -j ACCEPT
  changed_when: false

- name: Allow FORWARD return traffic to private subnet
  ansible.builtin.shell: |
    iptables -C FORWARD -d 192.168.3.16/28 -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null \
    || iptables -I FORWARD 2 -d 192.168.3.16/28 -m state --state RELATED,ESTABLISHED -j ACCEPT
  changed_when: false

- name: Save iptables rules
  ansible.builtin.shell: iptables-save > /etc/iptables/rules.v4
  changed_when: false