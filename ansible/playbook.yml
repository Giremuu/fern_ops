---
# Play 1 - Nginx first: sets up NAT so private instances can reach internet
- name: Setup nginx instance
  vars_files:
    - vars/docker.yml
  hosts: nginx
  become: true
  roles:
    - base
    - node_exporter

# Play 2 - Private instances can now reach internet via NAT
- name: Base setup on private instances
  hosts: monitoring:uptime_kuma
  become: true
  vars_files:
    - vars/docker.yml
  roles:
    - base
    - node_exporter

- name: Deploy monitoring stack
  hosts: monitoring
  become: true
  vars_files:
    - vars/docker.yml
  roles:
    - prometheus