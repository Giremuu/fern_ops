---
# Play 1 - Nginx first: sets up NAT so private instances can reach internet
- name: Setup nginx instance
  hosts: nginx
  become: true
  vars_files:
    - vars/docker.yml
  roles:
    - base
    - node_exporter

# Play 2 - Private instances can now reach internet via NAT
- name: Base setup on private instances
  hosts: monitoring:uptime_kuma
  become: true
  vars_files:
    - vars/docker.yml
  roles:
    - base
    - node_exporter

# Play 3 - Monitoring stack
- name: Deploy monitoring stack
  hosts: monitoring
  become: true
  vars_files:
    - vars/docker.yml
    - vars/vault.yml
  roles:
    - prometheus
    - grafana

# Play 4 - Uptime Kuma
- name: Deploy Uptime Kuma
  hosts: uptime_kuma
  become: true
  vars_files:
    - vars/docker.yml
  roles:
    - uptime_kuma
